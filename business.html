<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartYasemin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ionicons for beautiful icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="dark-mode business-mode">
    <div class="app-container">
      
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <img src="./assets/icon.png" alt="Logo" class="app-logo" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover;">
            <div class="logo-text">
              <span>SmartYasemin</span>
              <span class="logo-badge">Business</span>
            </div>
          </div>
        </div>
        
        <nav class="sidebar-nav">
          <div class="nav-section-title">İŞ ARAÇLARI</div>
          <a href="#" class="nav-item active" data-page="business/gelen-kutusu">
            <ion-icon name="mail-unread-outline"></ion-icon>
            <span>Gelen Kutusu</span>
          </a>
          <!-- İleride buraya Proje Yönetimi, Finans vb. sekmeler eklenebilir -->
        </nav>
        
        <div class="sidebar-footer">
          <div class="user-card">
            <div class="avatar">Y</div>
            <div class="user-info">
              <span class="user-name">Yasemin</span>
              <span class="user-role">Business Yönetici</span>
            </div>
          </div>
          
          <a href="index.html" class="workspace-switcher personal-ws">
            <div class="ws-icon">
              <ion-icon name="person"></ion-icon>
            </div>
            <div class="ws-info">
              <span class="ws-title">Kişisel Mod</span>
              <span class="ws-subtitle">Daily alanına dön</span>
            </div>
            <ion-icon name="chevron-forward-outline" class="ws-arrow"></ion-icon>
          </a>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        
        <!-- HEADER -->
        <header class="top-header">
          <div class="header-left">
            <h1 id="page-title">Gelen Kutusu</h1>
            <p id="current-date" class="date-text">12 Temmuz, Cuma</p>
          </div>
          <div class="header-right">
            <div class="search-box">
              <ion-icon name="search-outline"></ion-icon>
              <input type="text" id="global-search" placeholder="İş maillerinde ara...">
            </div>
            <a href="index.html" class="icon-btn mobile-switch" title="Daily Moduna Geç">
              <ion-icon name="sparkles-outline"></ion-icon>
            </a>
            <button class="icon-btn" title="Ayarlar" data-goto="ayarlar">
              <ion-icon name="settings-outline"></ion-icon>
            </button>
            <button class="icon-btn theme-toggle" title="Temayı Değiştir">
              <ion-icon name="sunny-outline"></ion-icon>
            </button>
            <button class="icon-btn" title="İş Bildirimleri" id="notif-btn">
              <ion-icon name="notifications-outline"></ion-icon>
              <span class="badge">1</span>
            </button>
          </div>
        </header>

        <!-- PAGE CONTENT CONTAINER -->
        <div class="page-content" id="dynamic-content">
          <!-- İçerik JavaScript ile dinamik olarak yüklenecek -->
          <div style="display: flex; justify-content: center; align-items: center; height: 100%; color: var(--text-muted);">
            <ion-icon name="reload-outline" class="spin" style="font-size: 2.5rem;"></ion-icon>
          </div>
        </div>

        <!-- Bildirimler Modal -->
        <div class="modal-overlay" id="notif-modal">
          <div class="modal-content" style="max-width: 450px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px;">
            <div class="modal-header">
              <h3 style="display: flex; align-items: center; gap: 8px;"><ion-icon name="notifications" style="color: var(--primary);"></ion-icon> İş Bildirimleri</h3>
              <button id="close-notif-btn" style="background:none; border:none; color:var(--text-color); font-size: 1.5rem; cursor:pointer;"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <div class="notif-list" style="display: flex; flex-direction: column; gap: 15px;">
              <div style="padding: 15px; border-radius: 16px; background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6;">
                <strong style="display: block; margin-bottom: 5px;">Yeni İş Maili 💼</strong>
                <span style="font-size: 0.9rem; color: var(--text-muted);">Gelen kutunuzda okunmamış 1 yeni mesaj var.</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./business-main.js"></script>
  </body>
</html>
