          <section id="film-oner" class="page-section active">
            <!-- YZ Arama Kutusu -->
            <div class="glass-panel" style="margin-bottom: 32px; padding: 24px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--primary-light);">
              <div>
                <h2 style="font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 8px;">
                  <ion-icon name="sparkles"></ion-icon> Hikayeden Film Bul
                </h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Hatırladığın bir sahneyi veya filmin konusunu anlat, yapay zeka senin için bulsun.</p>
              </div>
              <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <input type="text" id="ai-movie-prompt" class="glass-input" style="flex: 1; min-width: 250px;" placeholder="Örn: Rüyaların içine girip sır çalan bir hırsızın hikayesi...">
                <button class="btn-primary" id="ai-search-btn" style="white-space: nowrap;">
                  <ion-icon name="search-outline"></ion-icon> Hikaye Araması
                </button>
              </div>
            </div>

            <div class="panel-header" style="margin-bottom: 24px;">
              <div>
                <h2 style="font-size: 1.5rem; margin-bottom: 4px;">Günün Film Önerileri</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Sana özel seçtiğimiz, vizyonunu genişletecek harika yapımlar.</p>
              </div>
              <button class="btn-primary" id="open-film-modal"><ion-icon name="options-outline"></ion-icon> Kriterleri Belirle</button>
            </div>

            <!-- Tab System -->
            <div style="display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px;">
              <button id="tab-oneriler" class="btn-text" style="color: var(--primary); font-weight: bold; padding: 8px 16px; border-bottom: 2px solid var(--primary);">Öneriler</button>
              <button id="tab-izlediklerim" class="btn-text" style="color: var(--text-muted); padding: 8px 16px; border-bottom: 2px solid transparent;">İzlediklerim</button>
            </div>

            <div class="movie-grid" id="movie-grid">
              <!-- Filmler JavaScript ile (main.js) buraya yüklenecek -->
            </div>

            <div class="movie-grid" id="watched-movie-grid" style="display: none;">
              <!-- İzlenen Filmler buraya yüklenecek -->
            </div>

            <!-- FILM MODAL (POP-UP) -->
            <div class="modal-overlay" id="film-modal">
              <div class="modal-content glass-panel">
                <div class="modal-header">
                  <h3>Film Öneri Kriterleri</h3>
                  <button class="icon-btn-small close-modal"><ion-icon name="close-outline"></ion-icon></button>
                </div>
                <div class="modal-body">
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                      <label>Film Türü</label>
                      <select id="movie-genre-select" class="glass-input">
                        <option value="all">Fark Etmez</option>
                        <option value="878">Bilim Kurgu</option>
                        <option value="28">Aksiyon</option>
                        <option value="18">Dram</option>
                        <option value="35">Komedi</option>
                        <option value="27">Korku</option>
                        <option value="10749">Romantik</option>
                        <option value="53">Gerilim</option>
                        <option value="14">Fantastik</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Minimum IMDB Puanı</label>
                      <select id="movie-rating-select" class="glass-input">
                        <option value="0">Fark Etmez</option>
                        <option value="6">6.0 ve Üzeri</option>
                        <option value="7">7.0 ve Üzeri</option>
                        <option value="8">8.0 ve Üzeri (Süper)</option>
                        <option value="8.5">8.5 ve Üzeri (Başyapıt)</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Çıkış Yılı (Dönem)</label>
                      <select id="movie-year-select" class="glass-input">
                        <option value="all">Fark Etmez</option>
                        <option value="2020">2020'ler (2020-Günümüz)</option>
                        <option value="2010">2010'lar (2010-2019)</option>
                        <option value="2000">2000'ler (2000-2009)</option>
                        <option value="1990">90'lar Klasikleri (1990-1999)</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Sıralama Ölçütü</label>
                      <select id="movie-sort-select" class="glass-input">
                        <option value="popularity.desc">En Popüler</option>
                        <option value="vote_average.desc">En Yüksek Puanlı</option>
                        <option value="primary_release_date.desc">En Yeniler</option>
                      </select>
                    </div>
                  </div>
                  <button class="btn-primary" id="fetch-movies-btn" style="width: 100%; justify-content: center; margin-top: 24px; padding: 14px; font-size: 1.05rem;">
                    <ion-icon name="filter-outline"></ion-icon> Kriterlere Göre Filtrele
                  </button>
                </div>
              </div>
            </div>
          </section>
