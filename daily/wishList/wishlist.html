<section id="wishlist" class="page-section active">
  <div class="wishlist-header-container">
    <div class="wishlist-intro">
      <h2>İstek Listem</h2>
      <p>Takip etmek istediğin ürünlerin linkini yapıştır, indirimleri yakala.</p>
    </div>
    <div class="wishlist-stats">
      <div class="w-stat">
        <span class="w-stat-value">12</span>
        <span class="w-stat-label">Takipte</span>
      </div>
      <div class="w-stat">
        <span class="w-stat-value text-green">3</span>
        <span class="w-stat-label">İndirimde</span>
      </div>
    </div>
  </div>

  <div class="wishlist-add-box glass-panel">
    <div class="wishlist-input-wrapper">
      <ion-icon name="link-outline"></ion-icon>
      <input type="text" id="wishlist-url-input" placeholder="Trendyol, Amazon, Hepsiburada vs. ürün linkini yapıştır...">
      <button class="wishlist-add-btn" id="wishlist-add-btn">
        <ion-icon name="add-circle"></ion-icon>
        Ekle
      </button>
    </div>
  </div>

  <div class="wishlist-grid" id="wishlist-grid">
    <!-- Wishlist items will be rendered here dynamically -->
  </div>
</section>
