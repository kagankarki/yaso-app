<section id="ayarlar" class="page-section active mx-auto max-w-3xl">
  <div class="card p-6 sm:p-10">
    <div class="marquee"></div>

    <h2 class="mb-8 flex items-center gap-3 pt-4 text-2xl sm:text-3xl">
      <ion-icon name="settings" class="text-primary"></ion-icon> Uygulama Ayarları
    </h2>

    <div class="grid gap-6">

      <!-- Günlük Şifre Ayarları (En Üstte) -->
      <div class="card-inset border-primary p-6">
        <h3 class="mb-4 flex items-center gap-2.5 text-lg">
          <ion-icon name="key-outline" class="text-xl text-primary"></ion-icon> Günlük Şifresini Değiştir
        </h3>
        <p class="mb-5 text-sm text-muted">
          Günlüğüne girişte kullanacağın yeni şifreyi buradan anında güncelleyebilirsin.
        </p>

        <div class="flex flex-col gap-4">
          <div class="field">
            <label class="field-label" for="settings-diary-password">Yeni Şifreniz</label>
            <input type="password" id="settings-diary-password" class="input tracking-[4px]" placeholder="● ● ● ● ●">
          </div>
          <div class="flex flex-col items-stretch gap-3">
            <button id="settings-save-password-btn" class="btn btn-primary w-full">Şifreyi Değiştir</button>
            <span id="settings-password-status" class="block text-center text-sm font-semibold"></span>
          </div>
        </div>
      </div>

      <!-- Profil Ayarları -->
      <div class="card-inset p-6">
        <h3 class="mb-5 flex items-center gap-2 text-lg">
          <ion-icon name="person-circle-outline"></ion-icon> Profil Ayarları
        </h3>
        <div class="flex flex-col gap-4">
          <div class="field">
            <label class="field-label" for="settings-display-name">Görünen İsim</label>
            <input type="text" id="settings-display-name" class="input" value="Yasemin">
          </div>
          <div class="field">
            <label class="field-label" for="settings-email">E-Posta</label>
            <input type="email" id="settings-email" class="input" value="yasemin@smartyasemin.com">
          </div>
          <button class="btn btn-primary self-start">Değişiklikleri Kaydet</button>
        </div>
      </div>

      <!-- Bildirim Tercihleri -->
      <div class="card-inset p-6">
        <h3 class="mb-5 flex items-center gap-2 text-lg">
          <ion-icon name="notifications-outline"></ion-icon> Bildirim Tercihleri
        </h3>
        <div class="flex flex-col gap-2">

          <label class="flex cursor-pointer items-center justify-between gap-4 rounded-tile p-3 transition hover:bg-surface-2">
            <div>
              <strong class="block">Hatırlatıcı Bildirimleri</strong>
              <span class="text-sm text-muted">Su içme, spor ve günlük alışkanlıklar.</span>
            </div>
            <input type="checkbox" checked class="h-5 w-5 flex-none cursor-pointer accent-[var(--primary)]">
          </label>

          <label class="flex cursor-pointer items-center justify-between gap-4 rounded-tile p-3 transition hover:bg-surface-2">
            <div>
              <strong class="block">Aşk Bildirimleri 🥰</strong>
              <span class="text-sm text-muted">Özel mesajlar ve tatlı sürprizler.</span>
            </div>
            <input type="checkbox" checked class="h-5 w-5 flex-none cursor-pointer accent-[var(--primary)]">
          </label>

          <label class="flex cursor-pointer items-center justify-between gap-4 rounded-tile p-3 transition hover:bg-surface-2">
            <div>
              <strong class="block">Business Bildirimleri</strong>
              <span class="text-sm text-muted">İş mailleri, toplantılar ve projeler.</span>
            </div>
            <input type="checkbox" checked class="h-5 w-5 flex-none cursor-pointer accent-[var(--primary)]">
          </label>

        </div>
      </div>

    </div>
  </div>
</section>
